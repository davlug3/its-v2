name: its-v2

services:
    app:
        build:
            context: .
            dockerfile: .docker/php/Dockerfile
            target: runtime
        image: its-v2-app
        restart: unless-stopped
        working_dir: /var/www/html
        env_file:
            - .env
        volumes:
            - .:/var/www/html
        healthcheck:
            test: ['CMD-SHELL', 'php artisan about > /dev/null || exit 1']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    nginx:
        image: nginx:1.29-alpine
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - .:/var/www/html:ro
        depends_on:
            - app
        healthcheck:
            test: ['CMD-SHELL', 'wget -q --spider http://localhost/ || exit 1']
            interval: 30s
            timeout: 5s
            retries: 3

    node:
        image: node:24-bookworm
        profiles: ['dev']
        working_dir: /app
        environment:
            VITE_PORT: ${VITE_PORT:-5173}
        volumes:
            - .:/app
        command: sh -c 'npm install && npm run dev -- --host 0.0.0.0 --port "$VITE_PORT"'
        ports:
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'

    queue:
        build:
            context: .
            dockerfile: .docker/php/Dockerfile
            target: runtime
        image: its-v2-app
        profiles: ['queue']
        restart: unless-stopped
        working_dir: /var/www/html
        env_file:
            - .env
        volumes:
            - .:/var/www/html
        command: ['php', 'artisan', 'queue:work', '--tries=3', '--timeout=90']

    db:
        image: mysql:8.4
        profiles: ['local-db']
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: its
            MYSQL_USER: its
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        ports:
            - '3307:3306'
        volumes:
            - dbdata:/var/lib/mysql
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -proot --silent']
            interval: 10s
            timeout: 5s
            retries: 10

    redis:
        image: redis:8-alpine
        profiles: ['redis']
        restart: unless-stopped
        command: ['redis-server', '--appendonly', 'yes']
        ports:
            - '6380:6379'
        volumes:
            - redisdata:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    dbdata:
    redisdata:
